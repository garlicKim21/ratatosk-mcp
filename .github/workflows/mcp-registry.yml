# Manual (re)publish to the official MCP Registry for an existing tag.
# The automatic path lives in release.yml (job mcp-registry) — it must be a
# job there because GITHUB_TOKEN-created releases never trigger workflows.
name: mcp-registry
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "existing release tag, e.g. v0.3.3"
        required: true
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # server.json comes from main (schema fixes apply without re-tagging);
      # the pin step below rewrites version/image tag from the input tag.
      - uses: actions/checkout@v4
      - name: Pin server.json to the tag
        run: |
          V="${TAG#v}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" server.json
          sed -i "s#ratatosk-mcp:[0-9][^\"]*#ratatosk-mcp:$V#" server.json
          cat server.json
        env:
          TAG: ${{ inputs.tag }}
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
