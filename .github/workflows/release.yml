name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/garlickim21/ratatosk-mcp:${{ steps.meta.outputs.version }}
            ghcr.io/garlickim21/ratatosk-mcp:latest
  # Tag push alone must leave every version surface consistent: the GitHub
  # Release ("Latest") is created here so it cannot lag behind the image and
  # the server card again. Notes are commit-generated — edit the body after
  # publishing when a release deserves hand-written notes.
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
  # Official MCP Registry publish — a separate release-triggered workflow can
  # NOT do this: releases created with GITHUB_TOKEN never fire other workflows
  # (recursion guard, learned 2026-07-24 v0.3.3). Runs after the image exists
  # because the registry verifies the OCI label on the pushed image.
  mcp-registry:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Pin server.json to the release tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" server.json
          sed -i "s#ratatosk-mcp:[0-9][^\"]*#ratatosk-mcp:$V#" server.json
          cat server.json
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
