name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      # kagent needs every tool named in an allowlist to see it at all, and that
      # list lives in two YAML files nothing type-checks. v0.4.0 shipped
      # list_releases invisible to both install paths for exactly that reason:
      # adding a tool means editing main.go plus two manifests, and only a human
      # in a live cluster notices when the last two are forgotten. main.go is the
      # source of truth here; the manifests must agree with it on every push.
      - name: kagent tool allowlists match the registered tools
        run: |
          # gofmt는 구조체 리터럴 필드를 정렬해 "Name:" 뒤 공백이 여러 칸이 된다 —
          # 한 칸만 허용하던 구 패턴은 2026-08-10 도구 재작성 이후 아무것도 못 잡아
          # 이 검사가 3일간 조용히 빨간불이었다. \s+로 정렬 무관하게 잡는다.
          TOOLS="$(grep -oE '^\s*Name:\s+"[a-z_]+"' main.go | grep -oE '"[a-z_]+"' | tr -d '"' | sort)"
          echo "registered: $(echo "$TOOLS" | tr '\n' ' ')"
          for f in charts/ratatosk-mcp/templates/agent.yaml examples/kagent/ratatosk-agent.yaml; do
            LISTED="$(grep -oE '^ *- [a-z0-9_]+$' "$f" | sed 's/^ *- //' | grep -v '^k8s_' | sort)"
            if [ "$LISTED" != "$TOOLS" ]; then
              echo "::error file=$f::toolNames disagree with main.go"
              diff <(echo "$TOOLS") <(echo "$LISTED") || true
              exit 1
            fi
          done

      # The allowlist check above keeps the tools reachable; this one keeps the
      # instructions honest. Both prompt regressions so far were deletions —
      # a rule disappeared while rewording something near it, and the next live
      # run answered confidently and wrongly with nothing downstream able to
      # tell. The clause list is a record of failures we already paid for.
      - name: agent prompt keeps the rules live failures put there
        run: ./scripts/check-agent-prompt.sh

  # The static check above compares files. This one installs the chart on a real
  # cluster and asks the running server what it serves — the step whose absence
  # let v0.4.0 ship a chart pinned to the previous image with a tool the agent
  # could not call. Runs against the chart's appVersion, which is always an
  # already-published image on main.
  chart-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
      - uses: azure/setup-helm@v4
      - run: ./scripts/chart-smoke.sh
