replicaCount: 1

image:
  repository: ghcr.io/garlickim21/ratatosk-mcp
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Upstream facts API. Point at a mirror if you proxy egress.
ratatoskUrl: https://ratatosk.io

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

# kagent 통합 (https://kagent.dev) — true면 RemoteMCPServer 등록과
# release-triage 예제 Agent까지 함께 설치된다. kagent CRD가 있는
# 클러스터에서만 켤 것.
kagent:
  enabled: false
  # kagent가 설치된 네임스페이스의 ModelConfig 이름
  modelConfig: default-model-config
  agent:
    # false면 RemoteMCPServer 등록까지만 하고 예제 Agent는 만들지 않는다
    enabled: true
    name: release-triage-agent
