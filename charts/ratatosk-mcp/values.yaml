replicaCount: 1

image:
  repository: ghcr.io/garlickim21/ratatosk-mcp
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Upstream facts API. Point at a mirror if you proxy egress.
ratatoskUrl: https://ratatosk.io

# Serve HTTP without per-session state: no Mcp-Session-Id round-trip, and the
# only HTTP mode that speaks the 2026-07-28 protocol revision (older clients
# keep working either way — measured). Default off so existing installs see
# no transport change; turn on for horizontally-scaled or hosted setups.
statelessHttp: false

# Log level (MCP_LOG): "" = info. "debug" adds per-call timing — still
# argument-free; no request content reaches logs at any level (see
# docs/logging-design.md, "the invariant").
logLevel: ""

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

# kagent integration (https://kagent.dev) — when true, installs the
# RemoteMCPServer registration and an example Agent (ratatosk-agent) alongside
# the server. Enable only on clusters where the kagent CRDs exist.
kagent:
  enabled: false
  # Name of the ModelConfig in your kagent installation
  modelConfig: default-model-config
  agent:
    # false registers the server only, without the example Agent
    enabled: true
    name: ratatosk-agent
    # Grants the agent kagent's built-in read-only cluster tools
    # (k8s_get_resources, k8s_get_resource_yaml) so it can discover running
    # versions itself. Requires kagent-tool-server in the install namespace
    # (present in a default kagent install). Set false to keep the agent
    # cluster-blind; it will ask for versions instead.
    k8sTools: true
