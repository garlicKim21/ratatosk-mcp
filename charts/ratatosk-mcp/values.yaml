replicaCount: 1

image:
  repository: ghcr.io/garlickim21/ratatosk-mcp
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Upstream facts API. Point at a mirror if you proxy egress.
ratatoskUrl: https://ratatosk.io

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
