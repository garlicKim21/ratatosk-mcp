replicaCount: 1

image:
  repository: ghcr.io/garlickim21/ratatosk-mcp
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Upstream changes API. Point at a mirror if you proxy egress.
ratatoskUrl: https://ratatosk.io

# Serve HTTP without per-session state: no Mcp-Session-Id round-trip, and the
# only HTTP mode that supports the 2026-07-28 MCP protocol revision (older
# clients keep working either way). Off by default; turn on when your HTTP
# clients send the Mcp-Protocol-Version: 2026-07-28 header (a stateful server
# answers them with HTTP 400), or when you run more than one replica.
statelessHttp: false

# Log level (MCP_LOG): "" = info; "debug", "warn", "error" also accepted —
# any other value silently falls back to info (no warning, so check for
# typos). "debug" adds per-call timing — still argument-free; no request arguments
# appear in operational log lines at any level (auditMode below is the
# explicit opt-in that does record request content, on the same stderr
# stream). Details in docs/install.en.md.
logLevel: ""

# Audit stream (MCP_AUDIT): "" = off (default). "metadata" records one JSON
# line per tool call (event:"audit") with tool, outcome, caller clientInfo
# (absent when statelessHttp is on — no session carries it) and argument
# NAMES; "full" adds argument values. Emitted inside your cluster,
# into your collectors; the records never leave your perimeter. Retention and
# tamper-evidence are the collector's job; route on event=audit.
auditMode: ""

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

# kagent integration (https://kagent.dev) — when true, installs the
# RemoteMCPServer registration and an example Agent (ratatosk-agent) alongside
# the server. Enable only on clusters where the kagent CRDs exist.
kagent:
  enabled: false
  # Name of the ModelConfig in your kagent installation
  modelConfig: default-model-config
  agent:
    # false registers the server only, without the example Agent
    enabled: true
    name: ratatosk-agent
    # Grants the agent kagent's built-in read-only cluster tools
    # (k8s_get_resources, k8s_get_resource_yaml) so it can discover running
    # versions itself. Requires kagent-tool-server in the install namespace
    # (present in a default kagent install). Set false to keep the agent
    # cluster-blind; it will ask for versions instead.
    k8sTools: true
